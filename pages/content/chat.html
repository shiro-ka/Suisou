<!-- 作例: チャット。解説は置かない ―― 「そのもの」を見せる場所。

     構成は Suisou の思想に従う:
       地べた（bg）に直接置くのはヘッダだけ。そのヘッダは Suisou 側の
       トップバーが担うので、作例は panel を並べるところから始まる。
       モノは panel に入れる。1枚にまとめず、領域ごとに1枚ずつ。
     組めなかった部分は styles.css の「作例」節に隔離してある。 -->
<div class="demo-app">


  <div data-suisou-layout="stack md:frame grow">

    <!-- チャンネル一覧。1枚の panel -->
    <nav data-suisou-layout="aside stack scroll" data-suisou-surface="panel" class="gap-1 demo-aside">
      <div data-suisou-text="s12 w600" class="muted">テキストチャンネル</div>
      <button data-suisou-btn="block on" type="button">#general</button>
      <button data-suisou-btn="block" type="button">#random</button>
      <button data-suisou-btn="block" type="button">#wixoss</button>
      <button data-suisou-btn="block" type="button">#suisou</button>
    </nav>

    <!-- チャンネルのヘッダ。これも1枚の panel -->
    <header data-suisou-layout="head row" data-suisou-surface="panel tight">
      <span data-suisou-layout="grow" data-suisou-text="s16 w700">#general</span>
      <span data-suisou-text="s12 w400" class="muted">4 人がオンライン</span>
    </header>

    <!-- ログ。1枚の panel -->
    <div data-suisou-layout="body stack scroll grow" data-suisou-surface="panel" class="gap-1">
      <div data-suisou-row data-suisou-media>
        <div data-suisou-media-icon data-suisou-avatar>し</div>
        <div data-suisou-media-content>
          <header><span>しろか</span><span>09:12</span></header>
          <p>テーマ名を水域にした。hadal / trench / fjord / shoal</p>
        </div>
      </div>
      <div data-suisou-row data-suisou-media>
        <div data-suisou-media-icon data-suisou-avatar>あ</div>
        <div data-suisou-media-content>
          <header><span>相棒</span><span>09:13</span></header>
          <p>値は変えていません。33/36 使用可・破綻0件のままです</p>
        </div>
      </div>
      <div data-suisou-row data-suisou-media>
        <div data-suisou-media-icon data-suisou-avatar>し</div>
        <div data-suisou-media-content>
          <header><span>しろか</span><span>09:20</span></header>
          <p>hover の色ってどう決まってる？</p>
        </div>
      </div>
      <div data-suisou-row data-suisou-media>
        <div data-suisou-media-icon data-suisou-avatar>あ</div>
        <div data-suisou-media-content>
          <header><span>相棒</span><span>09:21</span></header>
          <p>明るさは動かさず、面の色相のまま暗い側へ下げています。<span class="demo-code">FLOOR["hover"]</span> = 0.03 を満たす最大の L です</p>
        </div>
      </div>
      <div data-suisou-row data-suisou-media>
        <div data-suisou-media-icon data-suisou-avatar>し</div>
        <div data-suisou-media-content>
          <header><span>しろか</span><span>09:40</span></header>
          <p>属性でいこう。やっぱ見た目尖ってるしキレイだわ</p>
        </div>
      </div>
      </div>

    <!-- 入力欄。これも1枚の panel -->
    <div data-suisou-layout="foot row" data-suisou-surface="panel tight">
      <input data-suisou-layout="grow" data-suisou-field placeholder="#general へメッセージを送信">
      <button data-suisou-btn="icon" type="button" aria-label="送信"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14l11 -11" /><path d="M21 3l-6.5 18a.55 .55 0 0 1 -1 0l-3.5 -7l-7 -3.5a.55 .55 0 0 1 0 -1l18 -6.5" /></svg></button>
    </div>

  </div>
</div>
