<div data-suisou-tray data-suisou-layout="grow" data-suisou="scroll-y" data-suisou-text="typeset">
  <h1>Loading</h1>
  <h2>候補</h2>
  <div data-suisou-layout="grid">
    <div data-suisou-layout="stack center">
      <div data-suisou-layout="row">
        <progress></progress>
        <progress style="--suisou-spinner: 3rem"></progress>
      </div>
      <span>泡（枠なし）</span>
    </div>
    <div data-suisou-layout="stack center">
      <div data-suisou-layout="row">
        <progress class="cand-window-circle"></progress>
        <progress class="cand-window-circle" style="--suisou-spinner: 3rem"></progress>
      </div>
      <span>丸窓</span>
    </div>
    <div data-suisou-layout="stack center">
      <div data-suisou-layout="row">
        <progress class="cand-window-square"></progress>
        <progress class="cand-window-square" style="--suisou-spinner: 3rem"></progress>
      </div>
      <span>角窓</span>
    </div>
    <div data-suisou-layout="stack center">
      <div data-suisou-layout="row">
        <progress class="cand-porthole"></progress>
        <progress class="cand-porthole" style="--suisou-spinner: 3rem"></progress>
      </div>
      <span>舷窓</span>
    </div>
    <div data-suisou-layout="stack center">
      <div data-suisou-layout="row">
        <progress class="cand-ring"></progress>
        <progress class="cand-ring" style="--suisou-spinner: 3rem"></progress>
      </div>
      <span>輪（前の形）</span>
    </div>
  </div>
</div>
