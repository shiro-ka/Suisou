<div data-suisou-tray data-suisou-layout="grow" data-suisou="scroll-y" data-suisou-text="typeset">
  <h1>Loading</h1>
  <h2>候補</h2>
  <div data-suisou-layout="grid">
    <div data-suisou-layout="stack center">
      <div data-suisou-layout="row">
        <progress></progress>
        <progress style="--suisou-spinner: 3rem"></progress>
      </div>
      <span>泡（枠なし）</span>
    </div>
    <div data-suisou-layout="stack center">
      <div data-suisou-layout="row">
        <progress class="cand-frame"></progress>
        <progress class="cand-frame" style="--suisou-spinner: 3rem"></progress>
      </div>
      <span>丸窓スピナー</span>
    </div>
    <div data-suisou-layout="stack center">
      <div data-suisou-layout="row">
        <progress class="cand-frame cand-square"></progress>
        <progress class="cand-frame cand-square" style="--suisou-spinner: 3rem"></progress>
      </div>
      <span>角窓スピナー</span>
    </div>
    <div data-suisou-layout="stack center">
      <div data-suisou-layout="row">
        <progress class="cand-orbit"></progress>
        <progress class="cand-orbit" style="--suisou-spinner: 3rem"></progress>
      </div>
      <span>丸窓（背景なし・点が回る）</span>
    </div>
    <div data-suisou-layout="stack center">
      <div data-suisou-layout="row">
        <progress class="cand-ring"></progress>
        <progress class="cand-ring" style="--suisou-spinner: 3rem"></progress>
      </div>
      <span>輪（ゆったり）</span>
    </div>
  </div>
</div>
