<!-- Palette。data-slot の中身だけ app.js が埋める（値は computed から読むため） -->
<section class="page">
  <h1>Palette</h1>
  <p class="note" data-slot="summary"></p>
  <p class="note">
    ★<strong>アクセントは theme とセットで書く。</strong>
    <code>&lt;html data-suisou-theme="hadal" data-suisou-accent="jelly"&gt;</code>
    <br>
    アクセントの値は<strong>テーマごとに違う</strong>（面の彩度とアクセント強さが
    テーマの属性なので、同じ色相でも解が変わる）。そのため
    <code>palette.css</code> は複合選択子でしか定義していない ——
    <strong><code>accent</code> だけ書くと どの選択子にも当たらず、
    <code>:root</code> の既定に静かに落ちる。</strong>
    <code>tools/lint_css.py</code> が単独指定を検査する。
  </p>

  <div class="group">
    <h2>アクセント</h2>
    <div class="accent-row" data-slot="accents"></div>
    <p class="note" data-slot="accent-note"></p>
  </div>

  <div data-suisou-layout="stack" data-slot="tokens" class="gap-4"></div>
</section>
