  <h1>Theme</h1>
  <h2>テーマを選択</h2>
  <p>&lt;html&gt;タグに <code>data-suisou-theme</code> を追加し、値としてテーマを選択します<br>プライマリとアクセントはどちらも記入する必要があります</p>
  <pre><code>&lt;html data-suisou-theme="shoal jelly"&gt;</code></pre>
  <p>ページ内の一部にSuisouを利用する場合でなければ、&lt;html&gt;タグに追加するのが推奨です</p>
  <h2>テーマの種類</h2>
  <p>プライマリ4つ、アクセント9つの36通りのテーマがあります</p>
  <h3>プライマリテーマ</h3>
  <p>(パレットのプレビュー。色の話が終わったら作る)</p>
  <h3>アクセントテーマ</h3>
  <p>(パレットのプレビュー。色の話が終わったら作る)</p>
