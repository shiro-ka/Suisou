<!DOCTYPE html>
<html lang="ja" data-suisou-theme="hadal" data-suisou-accent="jelly">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suisou</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="palette.css">
<link rel="stylesheet" href="suisou.css">
</head>

<body>

<div class="app">

  <!-- 左 … プレビュー。ヘッダだけ固定で、中身が独立してスクロールする -->
  <main class="preview">
    <header class="topbar">
      <span class="brand">Suisou</span>
      <button class="btn-plain topbar-open" type="button">サイドバー</button>
    </header>

    <div class="preview-body">
      <!-- ページごとの中身。app.js が組み立てて、現在のものだけ表示する -->
      <section class="page page-palette"></section>
      <section class="page page-typography"></section>
    </div>
  </main>

  <!-- 右 … サイドバー。上2つが固定で、リストだけスクロールする -->
  <aside class="sidebar">
    <div class="sidebar-head">
      <button class="btn-plain sidebar-close" type="button">閉じる</button>
      <button class="theme-switch" type="button"></button>
    </div>

    <nav class="sidebar-nav">
      <button class="nav-item" type="button" data-page="palette">Palette</button>
      <button class="nav-item" type="button" data-page="typography">Typography</button>
    </nav>
  </aside>

</div>

<script src="suisou.data.js"></script>
<script src="app.js"></script>
</body>
</html>
