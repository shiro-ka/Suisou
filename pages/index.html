<!DOCTYPE html>
<html lang="ja" data-suisou-theme="shoal jelly">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suisou</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🐟</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://suisou.pages.dev/v3/suisou.css">

<link rel="stylesheet" href="helpers.css">

<link rel="stylesheet" href="styles.css">
</head>

<body data-suisou-body="shell right">

<header data-suisou-layout="row between">
  <span data-suisou-text="fs-16 fw-700">Suisou</span>
  <button data-suisou-button="icon" data-suisou="m:invisible" type="button" popovertarget="menu" aria-label="目次を開く">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6a2 2 0 0 1 2 -2h12a2 2 0 0 1 2 2v12a2 2 0 0 1 -2 2h-12a2 2 0 0 1 -2 -2l0 -12" /><path d="M15 4v16" /><path d="M10 10l-2 2l2 2" /></svg>
  </button>
</header>

<main data-slot="page"></main>

<nav data-suisou="m>hidden bd-left" data-suisou-layout="stack gap-1" data-slot="menu"></nav>

<nav id="menu" popover data-suisou-tray="drawer right" data-suisou-layout="stack">
  <div data-suisou-layout="row end">
    <button data-suisou-button="icon" type="button" popovertarget="menu" popovertargetaction="hide" aria-label="目次を閉じる">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6a2 2 0 0 1 2 -2h12a2 2 0 0 1 2 2v12a2 2 0 0 1 -2 2h-12a2 2 0 0 1 -2 -2l0 -12" /><path d="M15 4v16" /><path d="M9 10l2 2l-2 2" /></svg>
    </button>
  </div>
  <div data-suisou-layout="stack gap-1" data-slot="menu"></div>
</nav>

<script src="suisou.data.js"></script>
<script src="app.js"></script>
</body>
</html>
