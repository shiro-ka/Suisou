<!DOCTYPE html>
<html lang="ja" data-suisou-theme="hadal" data-suisou-accent="jelly">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suisou</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🐟</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">

<!-- 生成物 … 色 -->
<link rel="stylesheet" href="palette.css">
<!-- Suisou の部品。@import ではなく link で並べる（並列に落ちる） -->
<link rel="stylesheet" href="ui/base.css">
<link rel="stylesheet" href="ui/type.css">
<link rel="stylesheet" href="ui/layout.css">
<link rel="stylesheet" href="ui/button.css">
<link rel="stylesheet" href="ui/surface.css">
<link rel="stylesheet" href="ui/prose.css">
<link rel="stylesheet" href="ui/quote.css">
<link rel="stylesheet" href="ui/list.css">
<link rel="stylesheet" href="ui/code.css">
<link rel="stylesheet" href="ui/link.css">
<link rel="stylesheet" href="ui/table.css">
<link rel="stylesheet" href="ui/field.css">
<link rel="stylesheet" href="ui/row.css">
<link rel="stylesheet" href="ui/icon.css">
<link rel="stylesheet" href="ui/tag.css">
<link rel="stylesheet" href="ui/media.css">
<link rel="stylesheet" href="ui/avatar.css">
<!-- 任意。他にユーティリティの仕組みが無いときだけ -->
<link rel="stylesheet" href="helpers.css">
<!-- このサイトだけのもの -->
<link rel="stylesheet" href="styles.css">
</head>

<body data-suisou-root>

<!--
  ここは骨格だけ。切り替わる中身は content/*.html にあり、app.js が差し替える。
  固定されているもの（トップバーとサイドバー）だけがこのファイルに残る。
-->
<div class="app">

  <main class="preview">
    <header class="topbar">
      <span class="brand">Suisou</span>
      <button data-suisou-btn="icon" class="menu-open" type="button" aria-label="コンテンツメニューを開く">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6a2 2 0 0 1 2 -2h12a2 2 0 0 1 2 2v12a2 2 0 0 1 -2 2h-12a2 2 0 0 1 -2 -2l0 -12" /><path d="M15 4v16" /><path d="M10 10l-2 2l2 2" /></svg>
      </button>
    </header>

    <!-- ここに content/*.html が入る -->
    <div class="preview-body" data-slot="page"></div>
  </main>

  <aside class="menu">
    <div class="menu-head">
      <button data-suisou-btn="icon" class="menu-close" type="button" aria-label="コンテンツメニューを閉じる">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6a2 2 0 0 1 2 -2h12a2 2 0 0 1 2 2v12a2 2 0 0 1 -2 2h-12a2 2 0 0 1 -2 -2l0 -12" /><path d="M15 4v16" /><path d="M9 10l2 2l-2 2" /></svg>
      </button>
      <button class="theme-switch" type="button"></button>
    </div>

    <!-- 項目は app.js が PAGES から作る。ページを足すのは content/ に1枚置くだけ -->
    <nav class="menu-nav" data-slot="nav"></nav>
  </aside>

</div>

<script src="suisou.data.js"></script>
<script src="app.js"></script>
</body>
</html>
