<!DOCTYPE html>
<html lang="ja" data-suisou-theme="hadal jelly">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suisou</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🐟</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="palette.css">

<link rel="stylesheet" href="ui/base.css">
<link rel="stylesheet" href="ui/reset.css">
<link rel="stylesheet" href="ui/layout.css">
<link rel="stylesheet" href="ui/button.css">
<link rel="stylesheet" href="ui/tray.css">
<link rel="stylesheet" href="ui/field.css">
<link rel="stylesheet" href="ui/item.css">
<link rel="stylesheet" href="ui/spinner.css">
<link rel="stylesheet" href="ui/banner.css">

<link rel="stylesheet" href="ui/text.css">
<link rel="stylesheet" href="ui/util.css">
<link rel="stylesheet" href="ui/show.css">

<link rel="stylesheet" href="helpers.css">

<link rel="stylesheet" href="styles.css">
</head>

<body data-suisou-body>

<div class="app">

  <main class="preview">
    <header class="topbar">
      <span class="brand">Suisou</span>
      <button data-suisou-button="icon" class="menu-open" type="button" aria-label="コンテンツメニューを開く">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6a2 2 0 0 1 2 -2h12a2 2 0 0 1 2 2v12a2 2 0 0 1 -2 2h-12a2 2 0 0 1 -2 -2l0 -12" /><path d="M15 4v16" /><path d="M10 10l-2 2l2 2" /></svg>
      </button>
    </header>

    <div class="preview-body" data-slot="page"></div>
  </main>

  <aside class="menu">
    <div class="menu-head">
      <button data-suisou-button="icon" class="menu-close" type="button" aria-label="コンテンツメニューを閉じる">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6a2 2 0 0 1 2 -2h12a2 2 0 0 1 2 2v12a2 2 0 0 1 -2 2h-12a2 2 0 0 1 -2 -2l0 -12" /><path d="M15 4v16" /><path d="M9 10l2 2l-2 2" /></svg>
      </button>
      <button class="theme-switch" type="button"></button>
    </div>

    <nav class="menu-nav" data-slot="nav"></nav>
  </aside>

</div>

<script src="suisou.data.js"></script>
<script src="app.js"></script>
</body>
</html>
