name: サイトを配信

# ブランチを経由せず、artifact を直接 Pages に渡す。
# 生成物をリポジトリにコミットしないので、同期のズレが構造的に起きない。
#
# 前提: Settings > Pages > Source が「GitHub Actions」になっていること。
#       「Deploy from a branch」のままだと、この workflow は成功しても配信に反映されない。
#
# ★build と deploy を分けてある。artifact は「実行」単位ではなく「試行」単位で
#   積まれるので、1ジョブだと Re-run するたびに github-pages という名前の artifact が
#   増え、deploy-pages が「同じ名前が3個ある」と言って落ちる。分けておけば
#   失敗した deploy だけを Re-run でき、そのとき artifact は積まれない。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write     # Pages への OIDC 認証に必要

concurrency:          # 連続 push でデプロイが競合しないようにする
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0    # ★過去の版を建て直すので履歴が要る

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: パレットを生成する
        # 配信するのは常に solve.py の出力。コミット済みの生成物には依存しない。
        run: python3 tools/solve.py

      - name: 配る形を組み立てる
        # ★ここが「配布」の実体。dist/ は常に最新で、Suisou を直すと動く。
        #   固定したい現場は次の段が置く v/<sha> を指す。
        run: |
          SUISOU_VERSION="${GITHUB_SHA::7}" python3 tools/bundle.py

      - name: 配信するものを組み立てる
        run: |
          mkdir -p _site
          cp pages/index.html       _site/index.html
          cp pages/styles.css       _site/styles.css
          cp pages/helpers.css      _site/helpers.css     # 任意のヘルパー
          cp pages/app.js           _site/app.js
          cp -r pages/ui            _site/ui              # Suisou の部品（1ファイルずつ）
          cp -r pages/content       _site/content         # 差し替わるページの中身
          cp pages/palette.css      _site/palette.css     # solve.py の生成物
          cp pages/suisou.data.js   _site/suisou.data.js  # solve.py の生成物（構造のみ）

          # 配る形。<link> 1本で読める場所に置く
          cp -r dist _site/dist                               # 最新。移動する
          ls -1 _site/dist | head -3

      - name: 過去の版を建て直す
        # ★ビルド時間と artifact はコミット数に比例して伸びる（1版 ≒ 数秒 + 数百KB）。
        #   痛くなったら「pages/ か tools/ に触れた版 + 公開済みの版」に絞る。
        #   ただし一度公開した /v/<sha>/ を消すと固定 URL の約束が破れるので、
        #   絞るときは既存の版の一覧を先に固定すること。
        # ★artifact 配信は毎回サイトを丸ごと差し替えるので、前回置いた
        #   /v/<sha>/ は次の配信で消える。「固定できる URL」の約束が破れる。
        #   現場が繋いだ /v/4d55065/ が実際に 404 になった。
        #
        #   置き場を引き継ぐのではなく、その版を git から建て直す。
        #   真実の源泉は git であって配信物ではない、という形に寄せてある
        #   （再構築物が配信中のものとバイト単位で一致することを確認済み）。
        run: |
          for sha in $(git rev-list HEAD); do
            short=${sha:0:7}
            # bundle.py が生まれる前の版は配る形を持たない
            git cat-file -e "$sha:tools/bundle.py" 2>/dev/null || continue
            wt=$(mktemp -d)
            git worktree add -q --detach "$wt" "$sha"
            (
              cd "$wt"
              python3 tools/solve.py
              SUISOU_VERSION="$short" python3 tools/bundle.py
            ) && mkdir -p "_site/v/$short" && cp -r "$wt"/dist/* "_site/v/$short/"
            git worktree remove --force "$wt"
          done
          echo "固定 URL: $(ls -1 _site/v | wc -l) 版"
          ls -1 _site/v

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
