name: サイトを配信

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: パレットを生成する
        run: python3 tools/solve.py

      - name: 配る形を組み立てる
        run: |
          SUISOU_VERSION="${GITHUB_SHA::7}" python3 tools/bundle.py

      - name: 配信するものを組み立てる
        run: |
          mkdir -p _site
          cp pages/index.html       _site/index.html
          cp pages/styles.css       _site/styles.css
          cp pages/helpers.css      _site/helpers.css
          cp pages/app.js           _site/app.js
          cp -r pages/ui            _site/ui
          cp -r pages/content       _site/content
          cp pages/palette.css      _site/palette.css
          cp pages/suisou.data.js   _site/suisou.data.js
          cp pages/404.html         _site/404.html
          cp pages/_headers         _site/_headers

          cp -r dist _site/dist

          cp -r dist _site/v2

          for frozen in "v1:07c066f"; do
            name=${frozen%%:*}; sha=${frozen##*:}
            wt=$(mktemp -d)
            git worktree add -q --detach "$wt" "$sha"
            ( cd "$wt" && python3 tools/solve.py && SUISOU_VERSION="$sha" python3 tools/bundle.py )
            mkdir -p "_site/$name" && cp -r "$wt"/dist/* "_site/$name/"
            git worktree remove --force "$wt"
            echo "凍結: /$name/ ← $sha"
          done
          ls -1 _site/dist | head -3

      - name: 過去の版を建て直す
        run: |
          for sha in $(git rev-list HEAD); do
            short=${sha:0:7}
            git cat-file -e "$sha:tools/bundle.py" 2>/dev/null || continue
            wt=$(mktemp -d)
            git worktree add -q --detach "$wt" "$sha"
            (
              cd "$wt"
              python3 tools/solve.py
              SUISOU_VERSION="$short" python3 tools/bundle.py
            ) && mkdir -p "_site/v/$short" && cp -r "$wt"/dist/* "_site/v/$short/"
            git worktree remove --force "$wt"
          done
          echo "固定 URL: $(ls -1 _site/v | wc -l) 版"
          ls -1 _site/v

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
