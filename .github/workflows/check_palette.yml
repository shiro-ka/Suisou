name: パレットを検証

on:
  push:
    paths:
      - 'tools/solve.py'
      - 'pages/palette.css'
      - 'pages/suisou.data.js'
      - '.github/workflows/check_palette.yml'
  pull_request:
    paths:
      - 'tools/solve.py'
      - 'pages/palette.css'
      - 'pages/suisou.data.js'
      - '.github/workflows/check_palette.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 構造的破綻が無いか
        run: python3 tools/solve.py --check

      - name: 生成物が solve.py の出力と一致するか
        run: |
          python3 tools/solve.py
          if ! git diff --exit-code --stat -- pages/palette.css pages/suisou.data.js; then
            echo "::error::生成物が solve.py の出力とずれている。python3 tools/solve.py を実行してコミットし直すこと。"
            exit 1
          fi
