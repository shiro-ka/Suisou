<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>palette — 提出書</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root { color-scheme: dark; }
* { box-sizing: border-box; }
body { margin:0; padding:24px; max-width:1400px; margin-inline:auto;
  font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN",system-ui,sans-serif;
  background:#0d0d0f; color:#e8e8ea; font-size:13px; line-height:1.7; }
h1 { font-size:18px; margin:0 0 4px; }
h2 { font-size:14px; margin:34px 0 10px; padding-bottom:6px; border-bottom:1px solid #2a2a2e; color:#c8c8ce; }
h3 { font-size:12px; margin:20px 0 6px; color:#9a9aa0; font-weight:500; }
.lead { color:#8a8a90; font-size:12px; margin:0 0 8px; }
.mock { border-radius:12px; padding:16px; margin-bottom:14px; }
.panel { border-radius:12px; border:1px solid; padding:13px; margin-bottom:10px; }
.btn { border-radius:8px; border:1px solid; padding:5px 13px; background:transparent; font-family:inherit; font-size:13px; }
.field { border-radius:8px; border:1px solid; padding:6px 10px; width:250px; max-width:100%; }
.sw { width:108px; border-radius:8px; overflow:hidden; border:1px solid #2a2a2e; }
.sw .chip { height:38px; }
.sw .meta { font-size:10px; padding:4px 5px; background:#08080a; color:#9a9aa0; line-height:1.5; }
.sw .meta b { color:#d8d8de; font-weight:500; display:block; }
.swatches { display:flex; gap:7px; flex-wrap:wrap; margin-top:6px; }
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(430px,1fr)); gap:14px; }
table { border-collapse:collapse; font-size:11px; width:100%; }
td,th { padding:3px 10px 3px 0; text-align:left; color:#9a9aa0; font-weight:400; }
th { color:#6a6a70; border-bottom:1px solid #2a2a2e; }
td.v { text-align:right; font-variant-numeric:tabular-nums; }
.ok{color:#4ade80}.warn{color:#ffb020}.ng{color:#ff6b6b}
.pass { background:#0e2417; border:1px solid #1f6b3f; color:#86e0a8; border-radius:8px; padding:8px 11px; font-size:12px; }
.fail { background:#2a1113; border:1px solid #7a2b30; color:#ffa4a4; border-radius:8px; padding:8px 11px; font-size:12px; }
.note { background:#141420; border:1px solid #2e2e46; color:#b8b8d0; border-radius:8px; padding:9px 12px; font-size:12px; margin:8px 0; }
.pair { display:flex; border-radius:8px; overflow:hidden; width:190px; }
.pair div { height:52px; flex:1; }
.calrow { display:flex; gap:14px; flex-wrap:wrap; align-items:flex-start; }
.cal { font-size:11px; color:#9a9aa0; }
</style>
</head>
<body>
<h1>カラーパレット提出書</h1>
<p class="lead">値は <code>solve.py</code> が制約から解いたもの（<code>palette.data.js</code>）を読んで表示しているだけです。<br>
このページは計算しません。色を変えるときは <code>solve.py</code> を直して <code>python3 solve.py</code> を走らせます。</p>
<div id="app"></div>

<script src="palette.data.js"></script>
<script>
/* 表示用のみ。色の決定は solve.py が済ませてある。 */
const css=(t)=>`oklch(${(t.L*100).toFixed(1)}% ${t.C.toFixed(3)} ${t.H})`;
const lab=(t)=>[t.L,t.C*Math.cos(t.H*Math.PI/180),t.C*Math.sin(t.H*Math.PI/180)];
const dE=(a,b)=>{const x=lab(a),y=lab(b);return Math.hypot(x[0]-y[0],x[1]-y[1],x[2]-y[2]);};

const P=PALETTE;
let out='';

out+=`<div class="${P.failures.length?'fail':'pass'}">`
 +(P.failures.length?`<b>構造的な破綻 ${P.failures.length} 件</b><br>`+P.failures.slice(0,10).join('<br>')
   :`<b>構造的な破綻 0 件</b>　/　使える組み合わせ `
    +P.themes.reduce((n,t)=>n+Object.values(t.accents).filter(a=>a.available).length,0)
    +` / `+P.themes.length*Object.keys(P.accentHues).length)
 +`</div>`;

out+=`<div class="note"><b>L 階段は2系統</b>　<b>dark</b>（bg L${(P.ladders.dark.bg*100).toFixed(0)}）= grey / slate / nord-ish
<b>dim</b>（bg L${(P.ladders.dim.bg*100).toFixed(0)}）= ライト志向のユーザーへ投げる明るめの階段。極性は反転しません。<br>
ΔE フロア: hover ${P.floors.hover} / 選択 ${P.floors.selected} / 意味色 ${P.floors.semantic}（実物較正済み）/ text-sub ${P.floors.textSub}</div>`;

const SURF=['bg','panel','input','floating'];
function sw(name,tk,tokens){
  if(!tk)return `<div class="sw"><div class="chip" style="background:repeating-linear-gradient(45deg,#1a1a1c,#1a1a1c 6px,#222 6px,#222 12px)"></div><div class="meta"><b>${name}</b><span class="ng">解なし</span></div></div>`;
  return `<div class="sw"><div class="chip" style="background:${css(tk)}"></div>
   <div class="meta"><b>${name}</b>${tk.hex}<br>L${(tk.L*100).toFixed(0)} C${tk.C.toFixed(3)} H${tk.H}</div></div>`;}

function mock(t,an,av){
  const k=av.tokens, S=n=>k[n]?css(k[n]):'transparent';
  return `<div class="mock" style="background:${S('bg')}">
   <div style="color:${S('text-main')};font-weight:700;margin-bottom:8px">${t.name} + ${an}</div>
   <div class="panel" style="background:${S('panel')};border-color:${S('line-weak')}">
     <div style="color:${S('text-main')};margin-bottom:6px">パネルの見出し</div>
     <div style="background:${S('hover-surface')};padding:4px 9px;border-radius:6px;color:${S('text-sub')}">hover 中の行</div>
     <div style="background:${S('selected-surface')};border-left:2px solid ${S('accent')};padding:4px 9px;border-radius:6px;margin:4px 0 8px;color:${S('text-main')}">選択されている行</div>
     <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px">
       <button class="btn" style="border-color:${S('accent')};color:${S('accent')}">アウトライン</button>
       <button class="btn" style="border-color:${S('accent-active')};color:${S('accent-active')};background:${S('selected-surface')}">押下中</button>
       <button class="btn" style="background:${S('accent')};border-color:${S('accent')};color:${S('on-accent')}">塗り</button>
       <button class="btn" style="border-color:${S('line-weak')};color:${S('text-disabled')}">無効</button>
     </div>
     <input class="field" style="background:${S('input')};border-color:${S('line-strong')};color:${S('text-main')};box-shadow:0 0 0 1px ${S('bg')},0 0 0 3px ${S('focus-ring')}" value="フォーカス中（二重リング）">
     <div style="margin-top:9px;display:flex;flex-direction:column;gap:4px;font-size:12px">
       <div style="background:${S('error-surface')};border-left:2px solid ${S('error')};padding:4px 8px;border-radius:6px;color:${S('text-main')}">✕ 保存できませんでした</div>
       <div style="background:${S('warning-surface')};border-left:2px solid ${S('warning')};padding:4px 8px;border-radius:6px;color:${S('text-main')}">△ 取り消せません</div>
       <div style="background:${S('success-surface')};border-left:2px solid ${S('success')};padding:4px 8px;border-radius:6px;color:${S('text-main')}">✓ 保存しました</div>
     </div>
   </div>
   <div class="panel" style="background:${S('floating')};border-color:${S('line-strong')};box-shadow:0 10px 28px rgba(0,0,0,.5)">
     <div style="color:${S('text-main')}">浮くもの（モーダル）</div>
     <div style="background:${S('hover-surface')};padding:4px 9px;border-radius:6px;margin-top:5px;color:${S('text-sub')}">この面の上の hover 行</div>
   </div></div>`;}

for(const t of P.themes){
  const okA=Object.entries(t.accents).filter(([,v])=>v.available);
  const ngA=Object.entries(t.accents).filter(([,v])=>!v.available);
  const k0=okA.length?okA[0][1].tokens:Object.values(t.accents)[0].tokens;
  out+=`<h2>${t.name}　<span style="font-weight:400;color:#77777e;font-size:12px">階段 ${t.ladder} / H${t.h} / 面C ${t.cs} / 強さ ×${t.ar} / 意味色 ×${t.semRatio} / text-main L${(t.textMainL*100).toFixed(1)}</span></h2>`;
  out+=`<div class="pass">使えるアクセント ${okA.length}/${Object.keys(t.accents).length}：${okA.map(([a])=>a).join(', ')}`;
  if(ngA.length)out+=`<br><span style="color:#c8a0a8">除外：${ngA.map(([a,v])=>`${a}（${v.issues[0]}）`).join(' / ')}</span>`;
  out+=`</div><h3>トークン</h3><div class="swatches">`;
  for(const n of ['bg','panel','input','floating','line-weak','line-strong','text-disabled','text-sub','text-main'])out+=sw(n,k0[n],k0);
  out+=`</div><div class="swatches">`;
  for(const n of ['accent','accent-active','hover-surface','selected-surface','error','error-surface','warning','warning-surface','success','success-surface'])out+=sw(n,k0[n],k0);
  out+=`</div><h3>アクセント別プレビュー</h3><div class="grid">`;
  for(const[an,av]of okA)out+=mock(t,an,av);
  out+=`</div><h3>コントラスト検証</h3><table><tr><th>ペア</th><th>実測</th><th>必要</th><th></th></tr>`;
  const rows=okA.length?okA[0][1].pairs:[];
  for(const r of rows)
    out+=`<tr><td>${r.a} on ${r.b}</td><td class="v ${r.pass?'ok':'ng'}">${r.value===null?'解なし':r.value.toFixed(2)+':1'}</td><td class="v">${r.need}</td><td>${r.note}</td></tr>`;
  out+=`</table>`;
}

/* フロア較正 */
out+=`<h2>フロア較正（判定済み）</h2>
<p class="lead">2026-08-17、しろさまが実物を見て「<b>ΔE 0.058 でも区別できる</b>」と判定 → フロアを <b>${P.floors.semantic}</b> に確定。<br>
しきい値を動かすときはここを見直すこと。</p>`;
const cands=[];
for(const t of P.themes)for(const[an,av]of Object.entries(t.accents)){
  if(!av.tokens.accent)continue;
  for(const n of ['error','warning','success']){
    const d=dE(av.tokens.accent,av.tokens[n]);
    if(d<0.12)cands.push({d,t:t.name,an,n,tk:av.tokens});}}
cands.sort((x,y)=>x.d-y.d);
out+=`<div class="calrow">`;
for(const c of cands.slice(0,12))
  out+=`<div><div class="pair"><div style="background:${css(c.tk.accent)}"></div><div style="background:${css(c.tk[c.n])}"></div></div>
  <div class="cal"><b style="color:#d8d8de">ΔE ${c.d.toFixed(3)}</b><br>${c.t} / ${c.an}<br>vs ${c.n}</div></div>`;
out+=`</div>`;

/* 色相カテゴリのリスク */
out+=`<h2>色相カテゴリのリスク（ΔE では測れない）</h2>
<p class="lead">ΔE フロアを通っていても、色相のカテゴリとしては同族のペア。「オレンジ＝警告?」と読まれる可能性は ΔE では防げません。</p>
<table><tr><th>アクセント</th><th>意味色</th><th>色相差</th></tr>`;
for(const r of P.hueCategoryRisk.sort((a,b)=>a.deg-b.deg))
  out+=`<tr><td>${r.accent}</td><td>${r.semantic}</td><td class="v">${r.deg}度</td></tr>`;
out+=`</table>`;

document.getElementById('app').innerHTML=out;
</script>
</body>
</html>
